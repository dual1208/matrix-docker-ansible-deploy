---
- name: Permit managed-room MatrixRTC membership state
  hosts: matrix_servers
  become: true
  gather_facts: false
  vars_files:
    - family-room.yml
  tasks:
    - name: Validate the isolated call-power repair inputs
      ansible.builtin.assert:
        that:
          - gz_managed_rooms | length == 3
          - gz_managed_rooms | selectattr('key', 'equalto', 'development') | list | length == 1
          - >-
            (gz_managed_rooms | selectattr('key', 'equalto', 'development') |
            map(attribute='owner_localpart') | first) == 'api30'
          - >-
            'tcnowifi' in (gz_managed_rooms |
            selectattr('key', 'equalto', 'development') |
            map(attribute='member_localparts') | first)

    - name: Repair and verify call membership power levels
      block:
        - name: Create a temporary call-power repair script path
          ansible.builtin.tempfile:
            state: file
            suffix: -repair-call-power-levels.py
          register: gz_call_power_repair_script

        - name: Upload the call-power repair script
          ansible.builtin.copy:
            src: repair-call-power-levels.py
            dest: "{{ gz_call_power_repair_script.path }}"
            mode: "0700"

        - name: Run the isolated red probe and managed-room repair
          ansible.builtin.command:
            argv:
              - python3
              - "{{ gz_call_power_repair_script.path }}"
              - --homeserver-url
              - "https://{{ matrix_server_fqn_matrix }}"
              - --domain
              - "{{ matrix_domain }}"
              - --rooms-json
              - "{{ gz_managed_rooms | to_json }}"
              - --probe-room-key
              - development
              - --probe-localpart
              - tcnowifi
          register: gz_call_power_repair
          changed_when: (gz_call_power_repair.stdout | from_json).get('changed', false) | bool

        - name: Report the safe call-power verification result
          ansible.builtin.debug:
            var: gz_call_power_repair.stdout
      always:
        - name: Remove the temporary call-power repair script
          ansible.builtin.file:
            path: "{{ gz_call_power_repair_script.path | default('') }}"
            state: absent
          when: gz_call_power_repair_script.path | default('') | length > 0
