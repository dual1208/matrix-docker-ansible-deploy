---
- name: Provision isolated private unencrypted managed rooms
  hosts: matrix_servers
  become: true
  gather_facts: false
  vars_files:
    - family-room.yml
  tasks:
    - name: Validate family room inputs
      ansible.builtin.assert:
        that:
          - gz_managed_rooms | length == 3
          - gz_managed_rooms | map(attribute='key') | unique | length == gz_managed_rooms | length
          - gz_managed_rooms | map(attribute='name') | unique | length == gz_managed_rooms | length

    - name: Provision and verify the family room with temporary sessions
      block:
        - name: Create a temporary provisioning script path
          ansible.builtin.tempfile:
            state: file
            suffix: -provision-room.py
          register: gz_family_room_script

        - name: Upload the room provisioner
          ansible.builtin.copy:
            src: provision-room.py
            dest: "{{ gz_family_room_script.path }}"
            mode: "0700"

        - name: Run the idempotent room provisioner for each isolation group
          ansible.builtin.command:
            argv:
              - python3
              - "{{ gz_family_room_script.path }}"
              - --homeserver-url
              - "https://{{ matrix_server_fqn_matrix }}"
              - --domain
              - "{{ matrix_domain }}"
              - --name
              - "{{ item.name }}"
              - --owner
              - "{{ item.owner_localpart }}"
              - --members
              - "{{ item.member_localparts | join(',') }}"
              - --display-names
              - "{{ item.display_names | to_json }}"
              - --room-id
              - "{{ item.room_id }}"
          loop: "{{ gz_managed_rooms }}"
          loop_control:
            label: "{{ item.key }}"
          register: gz_family_room_provision
          changed_when: (gz_family_room_provision.stdout | from_json).changed

        - name: Validate the provisioned room ID
          vars:
            gz_family_room_results: "{{ gz_family_room_provision.results }}"
          ansible.builtin.assert:
            that:
              - gz_family_room_results | length == gz_managed_rooms | length

        - name: Report the public room ID
          ansible.builtin.debug:
            msg: >-
              {{ item.item.key }} room ready:
              {{ (item.stdout | from_json).room_id }}
          loop: "{{ gz_family_room_provision.results }}"
          loop_control:
            label: "{{ item.item.key }}"
      always:
        - name: Remove the temporary provisioning script
          ansible.builtin.file:
            path: "{{ gz_family_room_script.path | default('') }}"
            state: absent
          when: gz_family_room_script.path | default('') | length > 0
