---
- name: Verify gz ACME renewal state without changing it
  hosts: matrix_servers
  become: true
  tasks:
    - name: Inspect TCP 80 listeners
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - -H
          - -ltn
          - sport = :80
      register: gz_acme_port_80
      changed_when: false
    - name: Require TCP 80 to be free outside ACME renewal
      ansible.builtin.assert:
        that: gz_acme_port_80.stdout | trim | length == 0
        fail_msg: TCP 80 is reserved for acme.sh standalone HTTP-01 and must not have a persistent listener.
    - name: Verify standalone renewal mode
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - Le_Webroot='no'
          - /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
      changed_when: false
      no_log: true
    - name: Verify the short-lived certificate profile
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - Le_Certificate_Profile='shortlived'
          - /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
      changed_when: false
      no_log: true
    - name: Verify the three-day renewal window
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - Le_RenewalDays='3'
          - /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
      changed_when: false
      no_log: true
    - name: Verify the combined certificate reload hook is registered
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Eq
          - ^Le_ReloadCmd='[^']+'$
          - /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
      changed_when: false
      no_log: true
    - name: Require the cron scheduler to be active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - cron.service
      changed_when: false
    - name: Require the cron scheduler to be enabled
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - --quiet
          - cron.service
      changed_when: false
    - name: Require the cron fallback to use the locked helper
      ansible.builtin.shell: >-
        set -o pipefail;
        /usr/bin/crontab -l 2>/dev/null
        | /usr/bin/grep -Eq
        '^[[:space:]]*[^#[:space:]][^#]*/usr/local/sbin/gz-acme-renew([[:space:]]|$)'
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
    - name: Reject an enabled direct acme.sh cron entry
      ansible.builtin.shell: >-
        ! /usr/bin/crontab -l 2>/dev/null
        | /usr/bin/grep -Eq
        '^[[:space:]]*[^#[:space:]][^#]*acme\.sh[^#]*--cron([[:space:]]|$)'
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
    - name: Require the ACME timer to be active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - gz-acme-renew.timer
      changed_when: false
    - name: Require the ACME timer to be enabled
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - --quiet
          - gz-acme-renew.timer
      changed_when: false
    - name: Require the latest ACME service result to be successful
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=Result
          - --value
          - gz-acme-renew.service
      register: gz_acme_service_result
      changed_when: false
      failed_when: gz_acme_service_result.stdout | trim != 'success'
    - name: Require the latest renewal check to have succeeded
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - result=ok
          - /var/lib/gz-acme-renew/status
      changed_when: false
    - name: Inspect renewal status freshness
      ansible.builtin.stat:
        path: /var/lib/gz-acme-renew/status
      register: gz_acme_status
    - name: Require renewal status from the last seven hours
      ansible.builtin.assert:
        that:
          - gz_acme_status.stat.exists
          - (ansible_date_time.epoch | int) - (gz_acme_status.stat.mtime | int) < 25200
        fail_msg: The locked ACME renewal status is missing or stale.
    - name: Require at least one day of certificate validity
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - x509
          - -checkend
          - '86400'
          - -noout
          - -in
          - /etc/peacelove/tls/fullchain.pem
      changed_when: false
    - name: Require the public IP in the certificate SAN
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - x509
          - -checkip
          - 8.163.2.191
          - -noout
          - -in
          - /etc/peacelove/tls/fullchain.pem
      changed_when: false
    - name: Verify the installed certificate chain
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - verify
          - -CApath
          - /etc/ssl/certs
          - -untrusted
          - /etc/peacelove/tls/fullchain.pem
          - /etc/peacelove/tls/fullchain.pem
      changed_when: false
    - name: Inspect certificate reload helpers
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/peacelove/tls-reload.sh
        - /usr/local/sbin/matrix-tls-sync
      register: gz_acme_reload_helpers
    - name: Require executable reload helpers
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
      loop: "{{ gz_acme_reload_helpers.results }}"
      loop_control:
        label: "{{ item.item }}"
