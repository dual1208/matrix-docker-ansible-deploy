---
matrix_playbook_migration_validated_version: v2026.05.18.0
matrix_domain: 8.163.2.191
matrix_server_fqn_matrix: 8.163.2.191
matrix_homeserver_implementation: synapse
matrix_playbook_reverse_proxy_type: playbook-managed-traefik
devture_systemd_docker_base_ipv6_enabled: false
devture_timesync_installation_enabled: false
docker_apt_gpg_key: /etc/apt/keyrings/imcalling-docker.asc

# Small private two-phone deployment; keep the host's existing PostgreSQL intact.
matrix_client_element_enabled: false
matrix_element_call_enabled: false
exim_relay_enabled: false
coturn_enabled: false
matrix_homeserver_federation_enabled: false
matrix_synapse_workers_enabled: false
matrix_synapse_report_stats: false
matrix_synapse_sentry_dsn: ""
matrix_synapse_usage_exporter_enabled: false
matrix_rageshake_enabled: false
matrix_sygnal_enabled: false
prometheus_enabled: false
grafana_enabled: false
matrix_synapse_enable_registration: false
matrix_synapse_allow_guest_access: false
matrix_synapse_event_cache_size: 10K
matrix_synapse_caches_global_factor: 0.5
matrix_synapse_cache_autotuning_max_cache_memory_usage: 67108864
matrix_synapse_cache_autotuning_target_cache_memory_usage: 33554432
postgres_shared_buffers: 65536
postgres_max_connections: 50

matrix_rtc_enabled: true
matrix_authentication_service_enabled: true
matrix_authentication_service_config_account_password_registration_enabled: false
matrix_authentication_service_config_account_password_registration_email_required: false
matrix_authentication_service_config_email_transport: blackhole
matrix_authentication_service_container_labels_traefik_additional_request_headers:
  Accept-Language: zh-Hans,zh;q=0.9
matrix_authentication_service_configuration_extension_yaml: |
  branding:
    service_name: 家庭聊天
    policy_uri: https://8.163.2.191/family/privacy/
  templates:
    path: /templates
    translations_path: /translations
matrix_authentication_service_container_extra_arguments:
  - --mount=type=bind,src=/matrix/matrix-authentication-service/config/templates,dst=/templates,ro
  - --mount=type=bind,src=/matrix/matrix-authentication-service/config/translations,dst=/translations,ro
matrix_authentication_service_config_clients_custom:
  - client_id: 01M2VM6HEE7G54S8RFEJEFK7DT
    client_auth_method: none
    redirect_uris:
      - com.dual1208.elementx:/oauth

# Native release identities are staged separately. Keep both flags false until
# the matching APK and IPA have passed physical-device login verification.
gz_client_auth_gateway_enabled: false
gz_client_auth_enforcement_enabled: false

# gz has a private interface behind its public IP. Explicitly advertise the IP.
livekit_server_config_rtc_use_external_ip: false
livekit_server_config_rtc_node_ip: 8.163.2.191
# TLS clients connecting to an IP may omit SNI; this is a dedicated TURN port.
livekit_server_container_labels_turn_traefik_rule: HostSNI(`*`)

# Existing acme.sh installation manages the shared IP certificate.
traefik_config_certificatesResolvers_acme_enabled: false
traefik_ssl_dir_enabled: true
# TCP 80 is reserved for acme.sh's short-lived standalone HTTP-01 listener.
traefik_config_entrypoint_web_enabled: false
traefik_configuration_extension_yaml: |
  providers:
    file:
      watch: true
  entryPoints:
    web-secure:
      http:
        aliasHeadersStrategy: reject
    matrix-federation:
      http:
        aliasHeadersStrategy: reject
traefik_provider_configuration_extension_yaml: |
  tls:
    certificates:
      - certFile: /ssl/fullchain.pem
        keyFile: /ssl/privkey.pem
    stores:
      default:
        defaultCertificate:
          certFile: /ssl/fullchain.pem
          keyFile: /ssl/privkey.pem
  {% if gz_client_auth_gateway_enabled | default(false) | bool %}
    options:
      default:
        clientAuth:
          caFiles:
            - /ssl/client-ca.pem
          clientAuthType: VerifyClientCertIfGiven
  {% endif %}

matrix_static_files_container_labels_base_domain_enabled: true
matrix_static_files_container_labels_base_domain_traefik_hostname: 8.163.2.191
matrix_static_files_container_labels_base_domain_traefik_priority: 1
