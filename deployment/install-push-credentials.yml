---
- name: Install owner-controlled push credentials without starting Sygnal
  hosts: matrix_servers
  become: true
  gather_facts: false
  tasks:
    - name: Require the complete private push credential set
      ansible.builtin.assert:
        that:
          - gz_push_android_app_id | default('') | length > 0
          - gz_push_fcm_project_id | default('') | length > 0
          - gz_push_fcm_service_account | default({}) | length > 0
          - gz_push_ios_app_id | default('') | length > 0
          - gz_push_apns_key_id | default('') | length > 0
          - gz_push_apns_team_id | default('') | length > 0
          - gz_push_apns_topic | default('') | length > 0
          - gz_push_apns_auth_key | default('') | length > 0
        fail_msg: >-
          Push credentials are incomplete in the ignored gz secrets inventory;
          no push service was installed or started.
      no_log: true

    - name: Create the private Sygnal data directory
      ansible.builtin.file:
        path: /matrix/sygnal/data
        state: directory
        owner: matrix
        group: matrix
        mode: "0700"

    - name: Install private push provider credentials
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: matrix
        group: matrix
        mode: "0600"
      loop:
        - dest: /matrix/sygnal/data/fcm-service-account.json
          content: "{{ gz_push_fcm_service_account | to_nice_json }}"
        - dest: /matrix/sygnal/data/apns-auth-key.p8
          content: "{{ gz_push_apns_auth_key }}"
      no_log: true
