---
- name: Install the shared ACME certificate into Matrix
  hosts: matrix_servers
  become: true
  tasks:
    - name: Verify the saved ACME domain before changing renewal mode
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - Le_Domain='8.163.2.191'
          - /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
      changed_when: false
      no_log: true
    - name: Back up existing ACME domain configuration once
      ansible.builtin.copy:
        src: /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
        dest: /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf.before-matrix
        remote_src: true
        force: false
        mode: '0600'
      no_log: true
    - name: Back up ACME configuration before standalone renewal once
      ansible.builtin.copy:
        src: /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
        dest: /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf.before-standalone
        remote_src: true
        force: false
        mode: '0600'
      no_log: true
    - name: Save standalone HTTP-01 as the renewal mode
      ansible.builtin.lineinfile:
        path: /root/.acme.sh/8.163.2.191_ecc/8.163.2.191.conf
        regexp: ^Le_Webroot=
        line: Le_Webroot='no'
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Check the standalone ACME server prerequisite
      ansible.builtin.command: /usr/bin/python3 --version
      changed_when: false
    - name: Inspect the reserved ACME port
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - -H
          - -ltn
          - sport = :80
      register: gz_acme_port_80
      changed_when: false
    - name: Require TCP 80 to be free outside ACME renewal
      ansible.builtin.assert:
        that: gz_acme_port_80.stdout | trim | length == 0
        fail_msg: TCP 80 is reserved for acme.sh standalone HTTP-01 and must not have a persistent listener.
    - name: Install certificate synchronization helper
      ansible.builtin.copy:
        src: matrix-tls-sync.sh
        dest: /usr/local/sbin/matrix-tls-sync
        owner: root
        group: root
        mode: '0755'
    - name: Synchronize current certificate
      ansible.builtin.command: /usr/local/sbin/matrix-tls-sync
      changed_when: true
    - name: Preserve certificate destinations and reload both HTTPS services
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --install-cert
          - -d
          - 8.163.2.191
          - --ecc
          - --key-file
          - /etc/peacelove/tls/privkey.pem
          - --fullchain-file
          - /etc/peacelove/tls/fullchain.pem
          - --reloadcmd
          - /etc/peacelove/tls-reload.sh && /usr/local/sbin/matrix-tls-sync
      changed_when: true
      no_log: true
